[project]
name = "claudevibecodeapptemplate"
version = "0.1.0"
description = "Backend for ClaudeVibeCodeAppTemplate."
readme = "README.md"
authors = [
    { name = "Gavin South", email = "gavinsouth@msn.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
claudevibecodeapptemplate = "claudevibecodeapptemplate:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, SIM simplify, N naming
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
